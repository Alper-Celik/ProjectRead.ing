name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  JUST_COLOR: always
  JUST_COMMAND_COLOR: green
  JUST_TIME: true
  JUST_HIGHLIGHT: true

jobs:
  ci:
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        shell: nix develop .#ci --command bash --noprofile --norc -eo pipefail {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: actions/cache@v6
        id: nuget-cache
        background: true
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - uses: nixbuild/nix-quick-install-action@v30
        with:
          nix_conf: |
            keep-env-derivations = true
            keep-outputs = true

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v7
        id: nixcache
        with:
          # restore and save a cache using this key
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          # if there's no cache hit, restore a cache by this prefix
          restore-prefixes-first-match: nix-${{ runner.os }}-
          # collect garbage until the Nix store size (in bytes) is at most this number
          # before trying to save a new cache
          # 1G = 1073741824
          gc-max-store-size-linux: 2G
          # do purge caches
          purge: true
          # purge all versions of the cache
          purge-prefixes: nix-${{ runner.os }}-
          # created more than this number of seconds ago
          purge-created: 0
          # or last accessed this duration (ISO 8601 duration format)
          # before the start of the `Post Restore and save Nix store` phase
          purge-last-accessed: P1DT12H
          # except any version with the key that is the same as the `primary-key`
          purge-primary-key: never

      # - uses: cachix/cachix-action@v17
      #   with:
      #     name: projectbook
      #     authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      #
      - wait: nuget-cache

      - name: Run Services
        id: services
        background: true
        run: nix run .#ci-services -- up --tui=false

      - name: Install Deps
        if: steps.nixcache.outputs.hit-primary-key != 'true'
        run: nix develop .#ci --command ls

      - name: Run ReUse Lint
        background: true
        continue-on-error: true
        run: just lint-reuse

      - name: Run Dotnet lints
        id: lint-dotnet
        continue-on-error: true
        background: true
        run: |
          just lint-dotnet

      - wait: lint-dotnet
      - name: tests
        continue-on-error: true
        env:
          TUNIT_GITHUB_REPORTER_STYLE: full
        run: just ci-test

      - name: Upload merged report
        if: always()
        background: true
        uses: actions/upload-artifact@v7
        with:
          name: merged-test-report
          path: ${{ runner.temp }}/tunit-aggregate/**/merged-report.html
          archive: false

      - name: wrangler
        uses: cloudflare/wrangler-action@v3
        id: codecov
        background: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: |
            pages deploy --project-name projectreading-dev --branch ${{ github.sha }} ./TestResults/

      - name: wrangler main
        uses: cloudflare/wrangler-action@v3
        background: true
        if: github.ref_name == 'main'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: |
            pages deploy --project-name projectreading-dev --branch main ./TestResults/

      - wait: codecov

      - run: |
          cat << EOF >> $GITHUB_STEP_SUMMARY
            #### See code test results at https://$(echo $GITHUB_SHA | head -c 28).projectreading-dev.pages.dev/$(basename $(find -name "*report.html"))
            #### See code coverage outputs at https://$(echo $GITHUB_SHA | head -c 28).projectreading-dev.pages.dev
          EOF

      - cancel: services
      - wait-all:
